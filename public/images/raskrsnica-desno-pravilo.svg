<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Нерегулируемый перекрёсток без знаков, машина A едет на север, машина B приближается справа от A и едет на запад">
  <rect width="320" height="320" rx="16" fill="#f4f4f2"/>

  <rect x="130" y="0" width="60" height="320" fill="#4a4a4a"/>
  <rect x="0" y="130" width="320" height="60" fill="#4a4a4a"/>

  <line x1="160" y1="0" x2="160" y2="120" stroke="#f4f4f2" stroke-width="4" stroke-dasharray="14 10"/>
  <line x1="160" y1="200" x2="160" y2="320" stroke="#f4f4f2" stroke-width="4" stroke-dasharray="14 10"/>
  <line x1="0" y1="160" x2="120" y2="160" stroke="#f4f4f2" stroke-width="4" stroke-dasharray="14 10"/>
  <line x1="200" y1="160" x2="320" y2="160" stroke="#f4f4f2" stroke-width="4" stroke-dasharray="14 10"/>

  <g>
    <rect x="143" y="235" width="34" height="56" rx="6" fill="#1e6b52"/>
    <text x="160" y="268" text-anchor="middle" fill="#ffffff" font-size="20" font-family="system-ui, sans-serif" font-weight="700">A</text>
    <polygon points="160,205 148,225 172,225" fill="#1e6b52"/>
  </g>

  <g>
    <rect x="228" y="143" width="56" height="34" rx="6" fill="#c9770a"/>
    <text x="256" y="166" text-anchor="middle" fill="#ffffff" font-size="20" font-family="system-ui, sans-serif" font-weight="700">B</text>
    <polygon points="205,160 225,148 225,172" fill="#c9770a"/>
  </g>

  <text x="160" y="20" text-anchor="middle" fill="#3a3a3a" font-size="13" font-family="system-ui, sans-serif">nema znakova ni semafora</text>
</svg>
